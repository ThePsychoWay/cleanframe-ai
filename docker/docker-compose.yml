# Infrastructure (postgres, redis, minio), the API, a CPU worker, the web app and, with `--profile gpu`, a GPU worker.
#
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build              # everything but the GPU worker
#   docker compose --env-file .env -f docker/docker-compose.yml --profile gpu up -d --build  # + GPU worker (NVIDIA driver
#                                                                                            #   and container toolkit on the host)
#
# --env-file .env matters: the web app's address settings (NEXT_PUBLIC_*) are compiled into the page when the image is
# built, so compose must see them at build time (the `env_file:` lines below only reach containers when they run).
#
# Renders go to the `cpu` queue for the dev and api engines and to the `gpu` queue for local/video models
# (RENDER_QUEUE=auto). To run everything on one machine without a GPU, set RENDER_QUEUE=cpu.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleanframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cleanframe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanframe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible storage for development only.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      # The browser PUTs upload parts straight to storage, so storage must allow the app's origin.
      # MinIO exposes the ETag response header by default, which the uploader needs.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Optional upload scanning (`--profile scan`, with MALWARE_SCAN=clamav and CLAMAV_HOST=clamav in .env). Uploads are
  # streamed to it; clamd skips or refuses files above its size limits, so they are raised past MAX_UPLOAD_SIZE (2 GiB by default).
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:stable
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_MAX_SIZE:-2048M}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_SIZE:-2048M}
      CLAMD_CONF_MaxScanSize: 1024M
    volumes:
      - clamdb:/var/lib/clamav
    restart: unless-stopped

  api:
    <<: &hardened
      # Containers that parse uploaded media get no extra privileges and a cap on processes (a decoder bug can't
      # fork-bomb the host). The base image already runs as a non-root user.
      security_opt: ["no-new-privileges:true"]
      cap_drop: ["ALL"]
      pids_limit: 1024
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: ../.env
    environment: &internal
      # Inside Docker the services are reached by name. Everything else comes from .env.
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://cleanframe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cleanframe
      STORAGE_ENDPOINT: http://minio:9000
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # The web app. NEXT_PUBLIC_* are build arguments: they are compiled into the pages and the security policy, so
  # change them in .env and rebuild (`up -d --build web`).
  web:
    <<: *hardened
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_STORAGE_ORIGIN: ${NEXT_PUBLIC_STORAGE_ORIGIN:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAX_UPLOAD_SIZE: ${NEXT_PUBLIC_MAX_UPLOAD_SIZE:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Runs analysis, tracking, and renders for engines that don't need a GPU.
  worker:
    <<: *hardened
    # Decoding hostile or huge video is where memory goes; cap it so one job can't take the machine down.
    mem_limit: ${WORKER_MEMORY_LIMIT:-8g}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: ../.env
    environment: *internal
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "cpu", "--concurrency=1", "--loglevel=info"]
    volumes:
      - worker-tmp:/tmp/cleanframe
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Schedules the retention sweep (deletes projects past VIDEO_RETENTION_HOURS). Run exactly one.
  beat:
    <<: *hardened
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: ../.env
    environment: *internal
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Renders with a PyTorch model on this machine's GPU. Only started with `--profile gpu`.
  worker-gpu:
    <<: *hardened
    mem_limit: ${WORKER_MEMORY_LIMIT:-8g}
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        INSTALL_AI: "true"
    env_file: ../.env
    environment: *internal
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "gpu", "--concurrency=1", "--loglevel=info"]
    volumes:
      - worker-tmp-gpu:/tmp/cleanframe
      # Put the model file here and point AI_MODEL_PATH at /models/<file>.
      - ../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  clamdb:
  pgdata:
  miniodata:
  worker-tmp:
  worker-tmp-gpu:
